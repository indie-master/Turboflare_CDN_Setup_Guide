# Example only. Do not create a second stream{} block when one already exists.
stream {
    map_hash_bucket_size 128;

    map $ssl_preread_server_name $backend {
        # install.sh writes a domain -> local vhost entry into this directory.
        include /etc/nginx/stream-map.d/*.map;

        # Keep all existing Reality/Selfsteal/XHTTP/gRPC routes here.
        default 127.0.0.1:8443;
    }

    server {
        listen 443 reuseport;
        proxy_pass $backend;
        ssl_preread on;
        proxy_protocol on;
        proxy_socket_keepalive on;
    }
}

